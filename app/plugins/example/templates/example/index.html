{% extends "plugins/base.html" %}

{% block plugin_styles %}
  <link rel="stylesheet" href="{{ url_for('example.static', filename='example.css') }}">
{% endblock %}

{% block content %}
  <h1>Example Application</h1>
  <p>{{ greeting }}</p>
  <dl class="example-plugin-meta">
    <dt>Plugin ID</dt>
    <dd>{{ plugin_id }}</dd>
    <dt>Plugin API</dt>
    <dd>v{{ plugin_api_version }}</dd>
    <dt>Stored Items</dt>
    <dd>{{ item_count }}</dd>
  </dl>
{% endblock %}
